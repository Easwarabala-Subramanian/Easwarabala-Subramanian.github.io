<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>E-paper · Easwarabala Subramanian</title>
<meta property="og:type" content="article"><meta property="og:title" id="ogt" content="E-paper"><meta property="og:image" id="ogi" content="">
<link rel="stylesheet" href="../assets/css/publisher.css">
<style>body{margin:0;font-family:system-ui,sans-serif}</style></head>
<body>
<div class="viewer">
  <div class="bar">
    <button id="tt" aria-label="Show page thumbnails">☰</button>
    <a href="index.html" aria-label="Back to all editions">← Editions</a>
    <span class="t" id="title"></span>
    <button id="prev" aria-label="Previous page">‹</button><span id="ctr" aria-live="polite">–</span><button id="next" aria-label="Next page">›</button>
    <button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button>
    <button id="fs" aria-label="Fullscreen">⛶</button>
    <a id="dlp" download aria-label="Download this page">⬇ Page</a><a id="dlf" download hidden>⬇ PDF</a>
  </div>
  <div class="body"><div class="thumbs" id="thumbs"></div><div class="stage" id="stage" tabindex="0"><img class="pg" id="pg" alt=""></div></div>
</div>
<p id="err" style="color:#fff;position:fixed;top:4rem;left:1rem" hidden></p>
<script type="module">
const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('issue');
let M, base, cur = 0, S = 1, X = 0, Y = 0, nat = { w: 1, h: 1 };
try {
  const idx = (await (await fetch('../issues/issues.json', { cache: 'no-store' })).json()).issues;
  const it = idx.find(i => i.id === id && i.type === 'epaper') || idx.filter(i => i.type === 'epaper')[0];
  if (!it) throw 0;
  base = '../' + it.path + '/'; M = await (await fetch(base + 'manifest.json')).json();
} catch (e) { $('err').hidden = false; $('err').textContent = 'This edition could not be found.'; throw e; }
document.title = M.title + ' · E-paper'; $('title').textContent = M.title; $('ogt').content = M.title; $('ogi').content = new URL(base + M.pages[0].thumb, location).href;
if (M.pdf) { $('dlf').hidden = false; $('dlf').href = base + 'source.pdf'; }
const stage = $('stage'), pg = $('pg');
$('thumbs').innerHTML = M.pages.map((p, i) => `<button data-i="${i}" aria-label="Go to page ${i + 1}"><img src="${base}${p.thumb}" alt="Page ${i + 1}" loading="lazy"></button>`).join('');
$('thumbs').onclick = e => { const b = e.target.closest('button'); if (b) { go(+b.dataset.i); $('thumbs').classList.remove('open'); } };
$('tt').onclick = () => $('thumbs').classList.toggle('open');
const fit = () => Math.min(stage.clientWidth / nat.w, stage.clientHeight / nat.h);
function apply() {
  const f = fit(), sw = nat.w * f * S, sh = nat.h * f * S, W = stage.clientWidth, H = stage.clientHeight;
  X = sw <= W ? (W - sw) / 2 : Math.min(0, Math.max(W - sw, X));
  Y = sh <= H ? (H - sh) / 2 : Math.min(0, Math.max(H - sh, Y));
  pg.style.width = nat.w * f + 'px'; pg.style.transform = `translate(${X}px,${Y}px) scale(${S})`;
}
function zoomAt(ns, cx, cy) { ns = Math.max(1, Math.min(6, ns)); const k = ns / S; X = cx - (cx - X) * k; Y = cy - (cy - Y) * k; S = ns; apply(); }
function go(i) {
  if (i < 0 || i >= M.pages.length) return; cur = i; const p = M.pages[i];
  nat = { w: p.w, h: p.h }; S = 1; pg.alt = `Page ${i + 1} of ${M.title}`; pg.src = base + p.img; apply();
  $('ctr').textContent = `${i + 1} / ${M.pages.length}`; $('dlp').href = base + p.img; $('dlp').download = `${M.title}-p${i + 1}`;
  document.querySelectorAll('#thumbs button').forEach((b, j) => { b.classList.toggle('cur', j === i); if (j === i) b.scrollIntoView({ block: 'nearest' }); });
  if (M.pages[i + 1]) new Image().src = base + M.pages[i + 1].img;
  history.replaceState(null, '', `#${i + 1}`);
}
$('prev').onclick = () => go(cur - 1); $('next').onclick = () => go(cur + 1);
$('zi').onclick = () => zoomAt(S * 1.5, stage.clientWidth / 2, stage.clientHeight / 2); $('zo').onclick = () => zoomAt(S / 1.5, stage.clientWidth / 2, stage.clientHeight / 2);
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1); else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1); else if (e.key === '+' || e.key === '=') $('zi').click(); else if (e.key === '-') $('zo').click(); else if (e.key === 'f') $('fs').click(); });
addEventListener('resize', apply); pg.onload = apply;
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); if (e.ctrlKey || e.metaKey || S > 1 || true) zoomAt(S * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
stage.addEventListener('dblclick', e => { const r = stage.getBoundingClientRect(); S > 1 ? zoomAt(1, 0, 0) : zoomAt(2.5, e.clientX - r.left, e.clientY - r.top); });
// pointer: pan, pinch, swipe
const ptrs = new Map(); let last = null, startX = 0, pinch = 0;
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); startX = e.clientX; last = { x: e.clientX, y: e.clientY }; if (ptrs.size === 2) pinch = dist(); });
const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); };
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) { const d = dist(), [a, b] = [...ptrs.values()], r = stage.getBoundingClientRect(); zoomAt(S * d / pinch, (a.clientX + b.clientX) / 2 - r.left, (a.clientY + b.clientY) / 2 - r.top); pinch = d; }
  else if (S > 1) { X += e.clientX - last.x; Y += e.clientY - last.y; apply(); }
  last = { x: e.clientX, y: e.clientY };
});
const up = e => { if (ptrs.size === 1 && S === 1 && Math.abs(e.clientX - startX) > 60) go(cur + (e.clientX < startX ? 1 : -1)); ptrs.delete(e.pointerId); };
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
go(Math.max(0, Math.min(M.pages.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1)));
</script></body></html>

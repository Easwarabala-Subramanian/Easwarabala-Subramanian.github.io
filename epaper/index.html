<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-paper · Easwarabala Subramanian</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/publisher.css"></head>
<body><div id="hdr"></div>
<section><div class="container"><div class="section-head"><h1>E-paper</h1></div><div id="out"><p>Loading…</p></div></div></section>
<div id="ftr"></div>
<script type="module">
import { shell, esc, fmtDate, loadIssues } from '../assets/js/pub/shell.js';
shell('epaper/');
const list = await loadIssues('epaper'), out = document.getElementById('out');
const link = i => 'viewer.html?issue=' + encodeURIComponent(i.id);
if (!list.length) out.innerHTML = '<p>No issues have been published yet.</p>';
else {
  const [l, ...rest] = list;
  out.innerHTML = `<div class="epaper-hero"><a href="${link(l)}"><img src="../${l.path}/${l.cover}" alt="Front page of ${esc(l.title)}"></a><div><h2>Latest edition</h2><h3>${esc(l.title)}</h3><p>${fmtDate(l.date)} · ${l.pageCount} pages</p><a class="btn btn-primary" href="${link(l)}">Read now</a></div></div>${rest.length ? '<h2>Earlier editions</h2><ul class="issue-list">' + rest.map(i => `<li><a href="${link(i)}">${esc(i.title)}</a> — ${fmtDate(i.date)}</li>`).join('') + '</ul>' : ''}`;
}
</script></body></html>

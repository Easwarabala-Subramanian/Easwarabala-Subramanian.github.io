<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magazine · Easwarabala Subramanian</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Source+Serif+4:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/publisher.css"></head>
<body><div id="hdr"></div>
<section><div class="container"><div class="section-head"><h1>Magazine</h1></div><div id="out"><p>Loading…</p></div></div></section>
<div id="ftr"></div>
<script type="module">
import { shell, esc, fmtDate, loadIssues } from '../assets/js/pub/shell.js';
shell('magazine/');
const list = await loadIssues('magazine'), out = document.getElementById('out');
const link = i => 'viewer.html?issue=' + encodeURIComponent(i.id);
if (!list.length) out.innerHTML = '<p>No issues have been published yet.</p>';
else out.innerHTML = '<div class="shelf">' + list.map(i => `<a class="card" href="${link(i)}"><img src="../${i.path}/${i.cover}" alt="Cover of ${esc(i.title)}" loading="lazy"><div><strong>${esc(i.title)}</strong><br><small>${i.issue ? 'Issue ' + esc(i.issue) + ' · ' : ''}${fmtDate(i.date)}</small></div></a>`).join('') + '</div>';
</script></body></html>
